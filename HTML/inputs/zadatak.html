<html>
	<head>
		<title>type of inputs</title>
		<style>
		#idGlavniDiv{
		display:flex;
		flex-direction:row;
		flex-wrap:wrap;
		padding: 2%;
		gap: 32px;
		}
		.klasa{
		gap:8px;
		display:flex;
		background-color:#f0faf7;
		padding:8px;
		border-radius:20px;
		align-items:center;
		}
		</style>
	</head>
	<body>
		<div id = "idGlavniDiv">
			<div class = "klasa">
				<label> type button</label>
				<input type="button" value="klikni">
			</div>
			
			<div class = "klasa">
				<label> type checkbox</label>
				<input type="checkbox">
			</div>
			
			<div class = "klasa">
				<label> type color</label>
				<input type="color">
			</div>
			
			<div class = "klasa">
				<label> type date</label>
				<input type="date">
			</div>
			
			<div class = "klasa">
				<label> type datetime-local</label>
				<input type="datetime-local">
			</div>	
			
			<div class = "klasa">
				<label> type file</label>
				<input type="file">
			</div>
			
			<div class = "klasa">
				<label> type password</label>
				<input type="password">
			</div>	
			
			<div class = "klasa">
				<label> type url</label>
				<input type="url" id = "idUrl" value=''>
			</div>	
			
			<div class = "klasa">
				<label> type range</label>
				<input type="range" value='90'>
			</div>
		</div>
		</script>
	</body>
</html>
