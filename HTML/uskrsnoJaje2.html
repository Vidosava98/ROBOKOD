<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Uskršnje jaje</title>

<style>
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  margin: 0;
  background: #f0f8ff;
  font-family: Arial, sans-serif;
  background-image:url('https://c4.wallpaperflare.com/wallpaper/348/756/995/grass-nature-holiday-eggs-wallpaper-preview.jpg');
  background-repeat:no-repeat;
  background-size: 100% 100%;
  }

h1 {
  margin-bottom: 20px;
}

.egg {
  width: 150px;
  height: 200px;
  border-radius: 50% 50% 45% 45%;
  background: linear-gradient(#ff9a9e, #fad0c4);
  position: relative;
  overflow: hidden;
  transition: transform 0.3s;
}

.egg:hover {
  transform: translateY(-10px) scale(1.05);
}

.egg::before,
.egg::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 20px;
  background: #f5f5f2;
}

.egg::before {
  top: 60px;
}

.egg::after {
  top: 120px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  border: none;
  background: #ff6b6b;
  color: white;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s;
}

button:hover {
  background: #ff3b3b;
}
</style>
</head>

<body>

<h1>Uskršnje jaje</h1>

<div class="egg" id="egg"></div>

<button onclick="changeEgg()">Promeni dizajn</button>

<script>
const designs = [
  "linear-gradient(#ff9a9e, #fad0c4)",
  "radial-gradient(#a18cd1, #fbc2eb)",
  "linear-gradient(#84fab0, #8fd3f4)",
  "radial-gradient(circle, white 10%, transparent 11%) 0 0/30px 30px, #32a852",
  "radial-gradient(circle, white 10%, transparent 31%) 0 0/30px 30px, #ffb703"
];

let index = 0;

function changeEgg() {
  const egg = document.getElementById("egg");
  index = (index + 1) % designs.length;
  egg.style.background = designs[index];
}
</script>

</body>
</html>
