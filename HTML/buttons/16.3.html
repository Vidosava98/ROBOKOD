 <html>
	<head>
	<title>Button style </title>
	<style>
	body{
	padding-top: 2%;
	padding-right: 10%;
	padding-left: 10%;
	padding-bottom: 10%;
	}
	#idGlavniDiv{
	margin-top:5%;
	display:flex;
	flex-wrap: wrap;
	gap:32px;
	}
	button{
	cursor:pointer;
	width: 150px;
	height:50px;
	}
	#idSacuvaj{
	border:none;
	color: #ffffff;
	background-color:#4bcc5a;
	box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
	}
	#idPosalji{
	color:#ffffff;
	background-color:lightblue;
	border:none;
	text-shadow: 2px 2px 10px rgba(0,0,0,0.5)
	}
	#idNext{
	display:flex;
	align-items:center;
	justify-content:center;
	gap:8px;
	}
	#idIkonica{
	width:25px;
	height:25px;
	}
	#idPlay{
	display:flex;
	align-items:center;
	justify-content:center;
	gap:8px;
	background-color:#FF0000;	
	}
	#idRounded{
	display:flex;
	align-items:center;
	justify-content:center;
	gap:8px;
	background-color:#FF0000;	
	border-radius:20px;
	border:none;
	}
	</style>
	</head>
	<body>
		<h2> Button razlicito stilizovan</h2>
		<div id="idGlavniDiv">
			<button>Klikni</button>
			<button id = "idSacuvaj">Sacuvaj</button>
			<button id = "idPosalji">Posalji</button>
			<button id = "idNext">
				NEXT
				<img src="next.svg" alt="Next" id = "idIkonica">
			</button>
			<button id = "idPlay">Play
				<img src="play.svg" alt="Play" id = "idIkonica">
			</button>
			<button id = "idRounded">
			    <img src="play.svg" alt="Play" id = "idIkonica">
			</button>
			
			
		</div>
	</body>
</html>
