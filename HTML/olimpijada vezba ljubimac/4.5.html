<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Ljubimac iz snova</title>

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/616/616408.png">

    <style>
        body {
            margin: 0;
            font-family: Arial;

            background-image: url("https://images.unsplash.com/photo-1517849845537-4d257902454a");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        h1 {
            text-align: center;
            color: white;
            margin-top: 30px;
        }

        .container {
            width: 300px;
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            margin: 50px auto;
            border-radius: 10px;
            color: white;
        }

        input {
            width: 100%;
            margin: 5px 0 10px 0;
            padding: 5px;
        }

        .radio-group {
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            height: 40px;
            background-color: #ff9800;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #e68900;
        }

        .result {
            text-align: center;
            margin-top: 15px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Ljubimac iz snova</h1>

    <div class="container">
        <label>Koji je ljubimac?</label>
        <input type="text" id="pet">

        <label>Koliko ima godina?</label>
        <input type="number" id="age">

        <div class="radio-group">
            <label><input type="radio" name="pol" value="muzjak"> Mužjak</label>
            <label><input type="radio" name="pol" value="zenka"> Ženka</label>
        </div>

        <button onclick="dodajLjubimca()">Dodaj ljubimca</button>
    </div>

    <div class="result">
        Ukupno ljubimaca: <span id="broj">0</span>
    </div>

    <script>
        let broj = 0;

        function dodajLjubimca() {
            broj++;
            document.getElementById("broj").innerText = broj;
        }
    </script>

</body>
</html>
