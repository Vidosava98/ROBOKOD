<html lang="sr">
<head>
    <title>Rezervacija bioskopske karte</title>

    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2798/2798007.png">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-image: url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        h1 {
            text-align: center;
            color: white;
            margin-top: 30px;
        }

        .container {
            width: 300px;
            background-color: rgba(0,0,0,0.8);
            padding: 20px;
            margin: 50px auto;
            border-radius: 10px;
            color: white;
        }

        input {
            width: 100%;
            margin: 5px 0 10px 0;
            padding: 5px;
        }

        .radio-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .radio-group input {
            width: auto;
            margin: 0;
        }

        button {
            width: 100%;
            height: 40px;
            background-color: #e53935;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #c62828;
        }

        .result {
            text-align: center;
            margin-top: 15px;
            color: white;
            font-size: 18px;
        }

        #poruka {
            text-align: center;
            margin-top: 10px;
            color: yellow;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Rezerviši bioskopsku kartu</h1>

    <div class="container">

        <label>Ime posetioca</label>
        <input type="text" id="ime">

        <label>Broj sedišta</label>
        <input type="number" id="sediste">

        <div class="radio-group">
            <label>
                <input type="radio" name
				
				karta" value="Standard">
                Standard
            </label>

            <label>
                <input type="radio" name="karta" value="VIP">
                VIP
            </label>
        </div>

        <button onclick="rezervisiKartu()">
            Rezerviši kartu
        </button>

        <div id="poruka"></div>

    </div>

    <div class="result">
        Ukupno rezervisanih karata:
        <span id="ukupno">0</span>
    </div>

    <script>

        let brojKarata = 0;

        function rezervisiKartu()
        {
            let ime = document.getElementById("ime").value;
            let sediste = document.getElementById("sediste").value;

            let karta =
                document.querySelector('input[name="karta"]:checked');

            if(ime == "" || sediste == "" || karta == null)
            {
                document.getElementById("poruka").innerText =
                    "Popunite sva polja!";
                return;
            }

            brojKarata++;

            document.getElementById("ukupno").innerText = brojKarata;

            document.getElementById("poruka").innerText =
                "Uspešno ste rezervisali " +
                karta.value +
                " kartu!";
        }

    </script>

</body>
</html>
